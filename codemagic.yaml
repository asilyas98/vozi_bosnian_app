workflows:
  vozi-appstore-ipa:
    name: Vozi App Store IPA - build only
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: "24"
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.simpleai.vozi
    scripts:
      - name: Install locked dependencies
        script: npm ci
      - name: Sync bundled web app and native dependencies
        script: npm run sync:ios
      - name: Check project inputs
        script: node scripts/cloud-preflight.mjs
      - name: Assign a cloud build number
        script: |
          set -euo pipefail
          cd ios/App
          agvtool new-version -all "$((100 + ${PROJECT_BUILD_NUMBER:?Missing Codemagic project build number}))"
      - name: Apply App Store signing profiles
        script: xcode-project use-profiles
      - name: Build IPA for later TestFlight upload
        script: |
          set -euo pipefail
          cd ios/App
          xcode-project build-ipa --project App.xcodeproj --scheme App
          test -n "$(find build/ios/ipa -name '*.ipa' -print -quit)"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        submit_to_testflight: true

  vozi-iphone-ipa:
    name: Vozi iPhone IPA - registered devices
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: "24"
      xcode: latest
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.simpleai.vozi
    scripts:
      - name: Install locked dependencies
        script: npm ci
      - name: Sync bundled web app and native dependencies
        script: npm run sync:ios
      - name: Check project inputs
        script: node scripts/cloud-preflight.mjs
      - name: Assign a cloud build number
        script: |
          set -euo pipefail
          cd ios/App
          agvtool new-version -all "$((100 + ${PROJECT_BUILD_NUMBER:?Missing Codemagic project build number}))"
      - name: Apply registered-device signing profiles
        script: xcode-project use-profiles
      - name: Build signed iPhone IPA
        script: |
          set -euo pipefail
          cd ios/App
          xcode-project build-ipa --project App.xcodeproj --scheme App
          test -n "$(find build/ios/ipa -name '*.ipa' -print -quit)"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  vozi-ios-simulator:
    name: Vozi simulator - no Apple signing
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      node: "24"
      xcode: latest
    scripts:
      - name: Install locked dependencies
        script: npm ci
      - name: Sync bundled web app and native dependencies
        script: npm run sync:ios
      - name: Check project inputs
        script: node scripts/cloud-preflight.mjs
      - name: Build simulator app
        script: bash scripts/build-ios.sh simulator
    artifacts:
      - build/Vozi-Simulator.zip